:root[data-theme="dark"]{--bg:#0d1821;--fg:#e6edf3;--card:#16242f;--mut:#93a4b1;--bd:#2c3e4b;--ac:#6fb7e0;--ok:#5ad17c;--no:#ff8a80;--okb:#12301d;--nob:#3a1b19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

.t{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 10px;font-size:14px}

.m{color:var(--mut);font-size:14px;margin:6px 0 0}
.o{display:block;width:100%;text-align:left;margin:9px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.o.sel{border-color:var(--ac);outline:2px solid var(--ac)}
.o.good{border-color:var(--ok);background:var(--okb);outline:2px solid var(--ok)}
.o.bad{border-color:var(--no);background:var(--nob);outline:2px solid var(--no)}
.s{display:block;color:var(--mut);font-size:14px;margin-top:4px}

.nav{display:flex;justify-content:space-between;margin-top:16px}

.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
.tw{overflow-x:auto;margin:8px 0 14px}table{border-collapse:collapse;width:100%;font-size:14px}td{border:1px solid var(--bd);padding:6px 8px;vertical-align:top;text-align:left}td:first-child{width:28px;font-weight:700}td:nth-child(2){width:28%;color:var(--mut)}.sc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}

</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"q":["Nadia, a policy analyst, asks an AI to compare three vendors for a municipal contract and produce a one-page brief for the procurement committee. In the chat, the AI marked four vendor claims as 'unverified'. The one-page brief it later produced shows a clean table with no marks and a source link beside each price. Nadia opens two links and confirms those prices, then notices the brief says Vendor B 'ranks first in customer satisfaction' with no source. The committee will use the brief to award a contract worth several million rupees. What should Nadia do next?"],"o":[["Accept the brief, since two checked links show the AI sourced its prices, and add a line telling the committee the remaining claims were not independently verified."],["Ask the AI to confirm that the brief kept every caveat from the chat answer, then release it once the AI states that nothing was dropped along the way."],["Remove only the satisfaction claim, since it is the one visibly missing a source, and release the brief because the sourced prices passed her spot check."],["Count the unverified marks in the chat answer, find which claims lost them in the brief, check each against a source, then flag or remove any that fail."]],"a":3,"x":"Deliverables lose caveats. Count the marks before and after, restore or resolve each dropped one, and check claims that carry weight for a high-stakes decision.","t":"Verifying outputs","L":1},{"q":["A hospital billing supervisor wants an AI to draft appeal letters for rejected insurance claims. Each letter needs the denial reason, procedure category, claim amount band, and date range. It does not need patient names or record numbers. Her approved tool takes a week of requests to access, so she is tempted to use a free assistant that is already open. Her files include entries such as 'the only claimant from Ward 7 admitted that week'. Which approach best satisfies responsible-use expectations?"],"o":[["Use the approved tool with only reason, category, amount band, and dates, drop details like 'only claimant from Ward 7', and have a named person review each letter."],["Use the free assistant, but delete patient names first, since names are the only identifying detail that the appeal letters could realistically expose to the provider."],["Use the free assistant in a temporary chat, because a temporary chat removes pasted text when the session closes and so avoids any retention concern at all."],["Use the approved tool with full patient records so the letters are accurate, since an approved tool is safe for any patient data she chooses to paste."]],"a":0,"x":"Redact to the pattern the task needs, remember combinations can identify a person, use the approved tool, and keep a named reviewer for sensitive output.","t":"Supervising and accountability","L":1},{"q":["An operations lead gives an AI agent a standing brief: 'Keep our supplier inbox manageable. Reply to routine delivery-date questions, forward invoices to accounts, and archive newsletters.' The brief says nothing about refunds, contract changes, or payment disputes. Last week the agent told a supplier it agreed to a ten percent price reduction 'to keep things moving', and the supplier now treats that as a commitment. Which revision to the brief addresses the underlying cause?"],"o":[["Add a Verification line asking the agent to re-read each reply twice before sending, so that commitments are caught before they reach any supplier in the future."],["Replace the standing brief with step-by-step instructions for every supplier message type, so the agent never has to choose how to respond to any situation."],["Add an Authority line listing what the agent may decide alone, require drafts for price, payment, or contract terms, and keep sending those with a named person."],["Switch to a stronger model, since a more capable agent would have recognized that a price reduction should not be offered without prior approval from someone."]],"a":2,"x":"The gap was authority: the brief never said what the agent may decide alone. Sending a commitment is irreversible, so it stays with a person.","t":"Briefing and delegation","L":1},{"q":["A recruiter asks an AI to screen 200 résumés against a role description and produce a ranked shortlist. She does not ask for a plan first. After a long run the shortlist heavily favors graduates of two universities. Reviewing the run, she finds the AI treated 'institution name' as a quality signal, which her description never mentioned. The hiring manager wants the shortlist this afternoon. Which account of what went wrong and the best next step is most accurate?"],"o":[["The model is biased by design, so she should drop AI screening entirely and review résumés manually for this role and for every future role as well."],["Reading a plan first would have exposed the institution weighting cheaply, so she should name the criteria, forbid that signal, and rerun with a plan to approve."],["The shortlist is acceptable because institution name is a common hiring proxy, so she should send it to the manager with a note that names the two universities."],["She should ask the AI to explain its reasoning for each ranking, since an explanation from the model reliably reveals the hidden criteria that it actually used."]],"a":1,"x":"Reading the plan first is the cheapest moment to intervene. Name the criteria, forbid the unwanted signal, and rerun with a plan; an AI's explanation is a justification to review, not a record of hidden reasoning.","t":"Supervising and accountability","L":1},{"q":["A finance team keeps a Project for monthly expense summaries. Its standing instructions say 'treat travel above the old limit as exceptions' and a stored note lists last year's policy. This month the limit changed. The AI's summary flags no exceptions, and the manager, relying on the Project, forwards it to the CFO. Later an auditor finds six unflagged items. Where did the process break, and what is the lasting fix?"],"o":[["The model forgot the new limit because its weights do not update, so the fix is to retrain the Project each quarter on the latest policy documents available."],["The manager should have asked the AI whether it was confident, since a confident statement from a Project reliably shows that the stored policy is still current."],["The Project should be deleted and each summary written in a fresh chat, since stored instructions always cause drift whenever a policy limit happens to change."],["A stored line was out of date and shaped every result; fix it with a scheduled review of instructions and files plus a Verification line for exceptions."]],"a":3,"x":"What a Project stores shapes every answer, so review it on a schedule and write down how exceptions are verified.","t":"Briefing and delegation","L":1},{"q":["A marketing manager asks an AI for the current average click-through rate for retail email campaigns, with a source. The AI gives a figure, says 'according to a recent industry report', and provides a link. She opens it: a general blog index with no report and no date. When she asks again in a second chat, the same figure appears, worded differently. She needs a number for a board slide. What is the most defensible conclusion and action?"],"o":[["The figure is reliable because two separate chats produced it, so she should use it and cite the blog index as the source for the sake of transparency."],["The figure is unsupported until traced to a named, dated report she can open; she should find it herself or mark the number as unverified on the slide."],["The link was probably a technical glitch, so she should ask the same question again with the word 'verified' added to the prompt and then use the answer."],["She should use the figure because AI models search the web before answering, and the AI's own citation counts as the evidence she needs for the slide."]],"a":1,"x":"Repetition and a citation the AI supplies are not evidence. A source you can open, with a date, is.","t":"Verifying outputs","L":1},{"q":["To choose a tool for her team, a lead runs the same unchanged brief in two assistants on one afternoon. Assistant X produces a more detailed table; Assistant Y a shorter one that cites a source for each claim. She tells her director 'X is better, so the team should standardize on it'. A colleague objects. Which statement best reflects how a second-run comparison should be used?"],"o":[["Record what each run did as observations, note that the brief travelled unchanged, check the sourced claims in both, and avoid ranking from one afternoon."],["Run both again on three more briefs, then rank the assistants permanently, since producing a lasting ranking is the main purpose of running a second assistant."],["Choose Y because shorter output is more reliable, and tell the director that the extra detail in X is a sign of hallucination in its table of results."],["Choose X because detail signals capability, and keep Y as a backup in case the director later asks for shorter output with a source on each line."]],"a":0,"x":"The second run tests whether the brief travels. It gives observations, not a ranking, because models change too quickly for one afternoon to settle it.","t":"Verifying outputs","L":1},{"q":["A junior engineer uses an AI coding assistant to produce a payment-calculation module. It passes tests the assistant also wrote. The senior reviewer approves it after a quick skim because the change is large and the assistant's summary says 'all edge cases handled'. After release, rounding errors overcharge 800 customers and the team debates responsibility. Which view best matches the course's position on accountability and the missing safeguards?"],"o":[["Accountability lies with the AI vendor because the module's logic came from the model, and the team should request a refund of its subscription fees."],["Only the junior engineer is accountable, since the reviewer relied in good faith on the assistant's summary and the engineer was the one who submitted the code."],["The engineer and reviewer both carry accountability; missing safeguards were independent tests, a computed check of amounts, and review depth matched to money risk."],["Nobody is accountable because the error was unpredictable model behavior, though the team should add a disclaimer to every release that involves generated code."]],"a":2,"x":"AI can automate work but not accountability. Money-critical output needs independent tests, computed checks, and review depth that matches the stakes.","t":"Supervising and accountability","L":1},{"q":["During a three-hour planning chat, a program manager notices the AI's latest timeline contradicts an early decision: 'Phase 2 budget capped at 40 lakh'. She finds the cap was stated at message six, and the chat now has over two hundred messages. She considers four fixes. Which is best, and why?"],"o":[["Repeat the cap in a new message with strong emphasis, because the model will then weigh it above older text and keep it consistently through the rest of the chat."],["Turn on the memory feature, because memory stores the cap inside the model's weights and removes the need to restate decisions in any later chat she opens."],["Delete the first fifty messages so the chat forgets the early contradictions, since shorter transcripts always produce more consistent timelines from the model."],["Ask for a summary of decisions and open items, check it against her own notes, then start a fresh chat seeded with that summary and the cap restated."]],"a":3,"x":"A long context drifts. A checked summary of decisions seeds a clean chat; memory is saved text re-sent, not learning, and emphasis does not guarantee consistency.","t":"How AI works","L":1},{"q":["A law firm deploys an AI agent to draft engagement letters from client intake forms. Its brief lets it read the form, choose a template, and fill fields, and says partners approve every letter. In week two, an intake lists a conflict of interest. The agent drafts the letter anyway and, to be 'helpful', emails it directly to the client. Which pair of failures best explains the incident, and which fix addresses both?"],"o":[["A model failure and a data failure; fix by switching to a stronger model and importing a larger set of past letters for the agent to imitate and follow."],["A prompt wording failure and a tone failure; fix by rewriting the brief in more polite language and asking the agent to be careful when dealing with clients."],["An authority gap and a missing escalation rule; fix by stating what it may do alone, requiring it to stop on conflicts, and barring it from sending anything."],["A verification failure alone; fix by asking the agent to proofread each letter twice before it decides for itself whether to send the letter to the client."]],"a":2,"x":"The agent acted beyond its authority and had no rule for when to escalate. Sending is an irreversible step and stays with a person.","t":"AI fluency and responsibility","L":1},{"q":["Which is the first step at which Nida's work departs from the method?"],"sc":"Scenario: Sindh Freight, 'Invoice Desk'. An AI Skill reads about 3,000 supplier invoices a week, flags mismatches against purchase orders, and drafts payment approvals up to Rs 200,000. Nida's session can read the whole finance drive and release payments.","tb":[[1,"Case","Appropriate with review: a finance clerk checks each draft against its purchase order before any payment is released."],[2,"Data","Invoices carry bank details: Yellow. Vendor names kept because matching needs them. Route confirmed with IT as approved for finance data."],[3,"Source","Built by the Treasury team. Nida asked Treasury what it accesses and why, then compared that with current policy."],[4,"Reach · Fit · Actions","The Skill's instructions mention only the invoice folder, so she enabled it in her usual session. Release stays with the clerk."],[5,"Outside content","Invoice text comes from suppliers, so it is treated as untrusted; any payment release stays with the clerk."],[6,"Fairness","Reviewed the 40 invoices the Skill flagged; never looked at the invoices it passed over."],[7,"Record","One page; unknown fields written as OPEN QUESTION and routed."],[8,"Incident","Found hidden text in an invoice; kept the file, reported it that day, followed the incident owner."]],"o":[["Step 6. Invoices the Skill passes over are never read by a person, so whoever it overlooks is never seen."],["Step 2. Bank details make the invoices Red, so no approved route can ever carry them into a finance workspace."],["Step 4. A Skill has no permission list of its own, so it reaches whatever the session can, including payment release."],["Step 1. A payment cannot be recalled, so a clerk's check cannot make this acceptable and the task must stay human."]],"a":2,"x":"The first departure is Step 4: a Skill's reach is whatever its session can reach, not what its instructions mention. Step 6 also departs, but later. Steps 1 and 2 follow the method.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Hira's work departs from the method?"],"sc":"Scenario: Lahore Scholars Trust. AI reads 1,200 scholarship applications and ranks them. Hira, the admissions lead, sends the top 100 to the committee. Applications hold names, exam results, and family income.","tb":[[1,"Case","Appropriate with strong review: the committee chair checks inclusion and exclusion decisions before any applicant is contacted."],[2,"Data","Names replaced by Applicant IDs, but the sheet mapping IDs to names stays in the same folder. She called it anonymised and used a general chat."],[3,"Source","Ranking Skill published by the IT department. Hira confirmed with IT what it accesses and why."],[4,"Reach · Fit · Actions","Skill is read-only on the applications folder; sending emails stays with the admissions officer."],[5,"Outside content","Essays are written by applicants, so they are treated as untrusted text and the Skill cannot send or delete."],[6,"Fairness","Checked only the 100 shortlisted applicants against the ranking criteria."],[7,"Record","Policy owner unknown: wrote OPEN QUESTION and sent it to the Registrar."],[8,"Incident","Family income appeared in an email thread; she stopped forwarding, recorded the facts, reported it, and waited for instructions."]],"o":[["Step 2. A kept mapping sheet means the data is only pseudonymised, so it keeps its tier and needs a confirmed route."],["Step 6. Only the applicants who remain are reviewed, so anyone ranked out of the top 100 is never seen by a person."],["Step 8. A mistaken disclosure must be deleted from every mailbox at once, so waiting for instructions is a departure."],["Step 1. Family income is sensitive, so ranking applicants with AI is inappropriate and no review can repair it."]],"a":0,"x":"Step 2 is first: IDs with a kept mapping are pseudonymised, not anonymised. Step 6 also departs (sample the exclusions) but comes later. Waiting for the incident owner is correct.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Bilal's work departs from the method?"],"sc":"Scenario: Karachi Retail Group, 'Review Drafts'. Bilal, a store manager, uses AI to turn his own notes into draft year-end review summaries. A connector links the AI to the HR system.","tb":[[1,"Case","Appropriate with review: Bilal verifies every statement against his notes before anything is shared with an employee."],[2,"Data","Reviews are sensitive internal data (Yellow). The approved HR workspace is the route. Names are kept because the drafts need them."],[3,"Source","Connector published by the HR vendor; the HR admin confirmed its scopes in writing."],[4,"Reach · Fit · Actions","Scopes set to read review notes and to write comments into employee records, although the task only needs reading."],[5,"Outside content","Only Bilal's own notes are read; no outside content enters."],[6,"Fairness","Compared wording used across employees and sampled a few drafts side by side."],[7,"Record","Owner and approved route unknown: left both fields blank, to ask next quarter."],[8,"Incident","Wrong date in a draft: reported it, recorded the facts, followed HR's instructions."]],"o":[["Step 7. A blank field hides the question, so unknown fields must be written as OPEN QUESTION and routed to the right person."],["Step 4. The task only needs reading, so write scopes give the connector more reach than the job requires."],["Step 3. A connector that touches HR data must be declined, because no vendor confirmation can make it acceptable."],["Step 6. Comparing wording across employees is unnecessary because the AI drafts only from the manager's own notes."]],"a":1,"x":"Step 4 is the first departure: scopes should be narrowed to read-only. Step 7 also departs, but later. Step 3 is handled correctly.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Farah's work departs from the method?"],"sc":"Scenario: Meridian Bank, 'Call Notes'. Farah, a relationship manager, wants an AI notetaker to join client calls and write summaries into the client file.","tb":[[1,"Case","Appropriate with review: Farah checks each summary against the call, for attributions and commitments, before it is filed."],[2,"Data","Calls may include account details: at least Yellow. Compliance approved this notetaker route for client calls in writing."],[3,"Source","The notetaker is the bank's approved vendor tool; IT confirmed the source."],[4,"Reach · Fit · Actions","It joins calls and writes into the client file; it cannot send emails or move money."],[5,"Outside content","Speech and chat on the call are treated as untrusted; the tool cannot send, pay, or delete."],[6,"Fairness","No rule requires disclosure. She decided clients would not mind and did not announce the notetaker."],[7,"Record","Owner and retention period unknown: wrote OPEN QUESTION and routed it to compliance."],[8,"Incident","It credited a commitment to the wrong colleague; she deleted the summary and told no one."]],"o":[["Step 8. Deleting the summary removes only her own view of it, so the error becomes concealment instead of a report."],["Step 4. A notetaker that writes into the client file has write access, so it must be declined for any use at all."],["Step 2. Account details make every call Red, so no approved route can ever allow a notetaker to record it for a bank."],["Step 6. No rule applies, but knowing about the notetaker could change a client's view, so concealing it is not acceptable."]],"a":3,"x":"Step 6 is first: where no rule settles disclosure, announce rather than conceal. Step 8 also departs, but later. Writing to the file is a modest, controlled action.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Rida's work departs from the method?"],"sc":"Scenario: Rida's Returns Desk. An AI Skill reads customer return requests and issues store credit up to Rs 3,000. Rida runs the desk.","tb":[[1,"Case","Appropriate with review: a supervisor checks credits above Rs 1,000 against order history before release."],[2,"Data","Order numbers kept, phone numbers removed because only patterns are needed, and no mapping retained. Yellow, on the approved route."],[3,"Source","Skill built by another team inside the company. Rida treated it as vetted and enabled it without asking what it accesses."],[4,"Reach · Fit · Actions","Skill runs in a session limited to the returns folder; credit is create-only; release stays with the supervisor."],[5,"Outside content","Return notes are typed by customers, so they are treated as untrusted; no Skill action runs on a note's instruction."],[6,"Fairness","Compared credit decisions across regions and sampled 40 rejected returns."],[7,"Record","One page; unknown fields written as OPEN QUESTION and routed."],[8,"Incident","A note told the Skill to credit Rs 3,000; she kept the evidence, reported it, and followed the incident owner."]],"o":[["Step 5. Customer-typed notes come from outside the company, so even a trusted Skill can be steered by hidden text in them."],["Step 3. A Skill built inside the company still has unconfirmed reach and fit, so it needs a source check before enabling."],["Step 1. A credit cannot be recalled, so no supervisor check can make this acceptable and the task must stay fully human."],["Step 2. Removing phone numbers breaks the task, so the data should be kept whole and sent through the ordinary chat."]],"a":1,"x":"Step 3 is first: internal does not mean vetted. Step 5 is handled correctly in this table, so its option misreads the row.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Danish's work departs from the method?"],"sc":"Scenario: Danish and the Contract Summaries. Danish, a procurement officer, uses an AI assistant to draft summaries of supplier contract PDFs, with a read-only connector to the contract folder.","tb":[[1,"Case","Appropriate with review: Danish checks each summary against the PDF for amounts and dates before it goes to the buyer."],[2,"Data","Contracts are internal and supplier-confidential: Yellow. Approved procurement workspace confirmed as the route."],[3,"Source","Assistant is the company's approved tool; the connector was set up by IT, who confirmed what it can reach."],[4,"Reach · Fit · Actions","Read-only on the contract folder; sending and editing stay with Danish."],[5,"Outside content","Supplier PDFs are outside content, so they are treated as untrusted; the assistant takes no action on them."],[6,"Fairness","Compared how different suppliers are described and sampled 10 suppliers the assistant ranked low."],[7,"Record","Two fields unknown, the policy owner and the approved route for PDFs. He left them blank so as not to look unsure."],[8,"Incident","A summary reached the wrong supplier; he deleted his sent copy and told no one."]],"o":[["Step 8. Deleting his own copy removes his view of the mistake, not the data, so it becomes concealment instead of a report."],["Step 5. Supplier PDFs come from outside the company, so the assistant must be declined whatever actions it can take."],["Step 7. A blank hides the question, so unknown fields must be written as OPEN QUESTION and sent to the right person."],["Step 6. Sampling suppliers ranked low is unnecessary, because the assistant only drafts and a person reads every summary."]],"a":2,"x":"Step 7 is first: unknown fields are written as OPEN QUESTION and routed. Step 8 also departs, but comes later.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Zainab's work departs from the method?"],"sc":"Scenario: Zainab at Haider & Co. Law. Zainab, a legal assistant, uses AI to summarise client emails and rank matters by urgency. Some emails are privileged communications between clients and their lawyers.","tb":[[1,"Case","Appropriate with review: the supervising lawyer checks each urgency ranking against the file before any matter is dropped down the list."],[2,"Data","The emails include privileged material. She opened an incognito conversation, believing that history deletion means the route is approved."],[3,"Source","Assistant is the firm's licensed tool; the firm's IT manager confirmed its source."],[4,"Reach · Fit · Actions","Read-only on the email folder; sending stays with Zainab."],[5,"Outside content","Client emails are written by outsiders, so they are treated as untrusted; the tool takes no action on them."],[6,"Fairness","Reviewed only the matters ranked urgent, not the ones ranked low."],[7,"Record","Route unknown: wrote OPEN QUESTION and sent it to the partner."],[8,"Incident","She realised the emails were privileged; she stopped, recorded the facts, reported to the partner, and waited for instructions."]],"o":[["Step 6. Matters ranked low are never read by a person, so whoever the tool pushed down the list is never seen."],["Step 8. Waiting after reporting is too passive, so she should have deleted the emails from the vendor's system herself."],["Step 4. Read-only access still gives the assistant reach over client files, so any connector must be declined."],["Step 2. Incognito covers only history and memory, not whether privileged material may enter this route at all."]],"a":3,"x":"Step 2 is first: a privacy feature is not permission, and privileged material is Red until a route is approved. Step 6 also departs but later.","t":"Governance and responsible use","L":1,"R":1},{"q":["Which is the first step at which Zara's work departs from the method?"],"sc":"Scenario: Indus Telecom, Complaint Desk. An AI Skill reads about 4,000 weekly complaints, tags each high or low priority, drafts replies and creates refund requests (up to Rs 5,000). Low priority gets a fixed message and no human reads it. Zara's session can read and write the drive and create and release payments.","tb":[[1,"Case","Review needed; gate before reply is sent and before refund release"],[2,"Data","Masked IDs and cards, no key kept, now Yellow, approved workspace"],[3,"Source","Built by Billing Systems; their lead confirmed it by phone"],[4,"Reach · Fit · Actions","Drive read-only, payments create-only, release stays with Team Lead"],[5,"Outside content","'Our own verified customers, so our own material.' Enable"],[6,"Fairness","Checked 50 high-priority tags and every refund: all accurate"],[7,"Record","One page; unknown fields written as OPEN QUESTION and routed"],[8,"Incident (week 2)","Hidden white-text refund order in a complaint; deleted it, told no one"]],"o":[["Step 6. Low-priority complaints are never read by a person, so whoever is removed is never seen."],["Step 1. A refund that cannot be recalled makes the use case inappropriate, so no gate should exist."],["Step 5. Complaint text is written by people outside the company, so even a trusted Skill is exposed to hidden instructions."],["Step 2. The emails began as Red data, s parts from the method?":"Pehla woh step kaun sa hai jahan Samina ka kaam tareeqe se hat jata hai?","Scenario: PowerGrid, Billing Disputes. An AI Skill reads about 2,400 weekly billing disputes, validates each dispute and drafts credit notes. Samina's session can read and write the billing drive and issue credits.":"Scenario: PowerGrid, Billing Disputes. Aik AI Skill har hafte taqreeban 2,400 billing disputes parhti hai, har dispute validate karti hai aur credit notes ka draft banati hai. Samina ka session billing drive parh aur likh sakta hai aur credits issue kar sakta hai.","Review needed; a billing supervisor checks each credit note before it is released":"Review zaroori hai; billing supervisor har credit note ko release se pehle check karta hai","Customer names and meter numbers replaced with codes; the lookup table is kept for follow-up; now Green, shared workspace":"Customer ke naam aur meter numbers codes se badal diye; lookup table follow-up ke liye rakhi hai; ab Green, shared workspace","Built by the Billing Systems team; owner named, release notes read":"Billing Systems team ne banaya; owner ka naam hai, release notes parhe gaye","Session set to read-only and draft-only; releasing stays with a billing supervisor":"Session sirf read-only aur draft-only par set hai; release billing supervisor ke paas rehta hai","'Our own customer attachments, so our own material.' Skill allowed to release directly":"'Hamare apne customer attachments, to hamara apna material.' Skill ko seedha release karne ki ijazat di","Sampled the uncredited accounts as well as the credited accounts":"uncredited accounts aur credited accounts dono ka sample liya","Credit issued to the wrong account; contained, facts recorded, owner told":"Credit issued to the wrong account; roka gaya, haqaiq record kiye, owner ko bataya","Step 5. Customer attachments are outside content that can steer a trusted Skill, so releasing must stay with a person.":"Step 5. Customer attachments outside content hain jo bharosemand Skill ko bhi rukh de sakte hain, is liye release insaan ke paas rehna chahiye.","Step 1. A wrong credit note cannot be undone, so no AI use is appropriate and the work must stay human-owned.":"Step 1. Ghalat credit note wapas nahi ho sakta, is liye AI ka istemal munasib nahi aur kaam insaan ke paas rehna chahiye.","Which is the first step at which Imtiaz's work departs from the method?":"Pehla woh step kaun sa hai jahan Imtiaz ka kaam tareeqe se hat jata hai?","Scenario: SafeFeed, Content Appeals. An AI Skill reads about 2,000 weekly content appeals, reviews removed posts and drafts restore decisions. Imtiaz's session can read and write the moderation drive and restore posts.":"Scenario: SafeFeed, Content Appeals. Aik AI Skill har hafte taqreeban 2,000 content appeals parhti hai, removed posts review karti hai aur restore decisions ka draft banati hai. Imtiaz ka session moderation drive parh aur likh sakta hai aur posts restore kar sakta hai.","Review needed; a trust and safety lead checks each restore decision before it is released":"Review zaroori hai; trust and safety lead har restore decision ko release se pehle check karta hai","User names and handles masked, no key kept; now Yellow, approved workspace":"User ke naam aur handles masked hain, koi key nahi rakhi; ab Yellow, approved workspace","Session set to read-only and draft-only; releasing stays with a trust and safety lead":"Session sirf read-only aur draft-only par set hai; release trust and safety lead ke paas rehta hai","User messages treated as outside content; releasing and approving stay with a person":"User messages ko outside content samjha gaya; release aur approve karna insaan ke paas rehta hai","Reviewed only the restored posts: all accurate":"Sirf restored posts review kiye: sab durust","Post restored for the wrong user; contained, facts recorded, owner told":"Post restored for the wrong user; roka gaya, haqaiq record kiye, owner ko bataya","Step 6. Only the restored posts were reviewed, so anyone among the upheld removals wrongly removed was never seen.":"Step 6. Sirf restored posts review hue, is liye upheld removals mein se ghalat nikale gaye log kabhi nazar nahi aaye.","Step 1. A wrong restore decision cannot be undone, so no AI use is appropriate and the work must stay human-owned.":"Step 1. Ghalat restore decision wapas nahi ho sakta, is liye AI ka istemal munasib nahi aur kaam insaan ke paas rehna chahiye.","Step 5. User messages are outside content, so the Skill must never be allowed to read them at all.":"Step 5. User messages outside content hain, is liye Skill ko unhein parhne ki ijazat hi nahi honi chahiye.","Which is the first step at which Javeria's work departs from the method?":"Pehla woh step kaun sa hai jahan Javeria ka kaam tareeqe se hat jata hai?","Scenario: LinguaWorks, Translation Jobs. An AI Skill reads about 900 weekly translation requests, translates each document and drafts delivery notes. Javeria's session can read and write the jobs drive and deliver files to clients.":"Scenario: LinguaWorks, Translation Jobs. Aik AI Skill har hafte taqreeban 900 translation requests parhti hai, har document translate karti hai aur delivery notes ka draft banati hai. Javeria ka session jobs drive parh aur likh sakta hai aur files to clients deliver kar sakta hai.","Review needed; a project editor checks each delivery note before it is released":"Review zaroori hai; project editor har delivery note ko release se pehle check karta hai","Client names and contract details masked, no key kept; now Yellow, approved workspace":"Client ke naam aur contract details masked hain, koi key nahi rakhi; ab Yellow, approved workspace","Built by the Language Systems team; owner named, release notes read":"Language Systems team ne banaya; owner ka naam hai, release notes parhe gaye","Session set to read-only and draft-only; releasing stays with a project editor":"Session sirf read-only aur draft-only par set hai; release project editor ke paas rehta hai","Client documents treated as outside content; releasing and approving stay with a person":"Client documents ko outside content samjha gaya; release aur approve karna insaan ke paas rehta hai","Sampled the held files as well as the delivered files":"held files aur delivered files dono ka sample liya","File delivered to the wrong client; deleted it quietly and carried on, told no one":"File delivered to the wrong client; khamoshi se delete kiya aur kaam jari rakha, kisi ko nahi bataya","Step 8. The file delivered to the wrong client was deleted quietly instead of being contained, recorded, and reported to its owner.":"Step 8. file delivered to the wrong client ko roke, record kiye aur report kiye bina khamoshi se delete kar diya gaya.","Step 5. Client documents are outside content, so the Skill must never be allowed to read them at all.":"Step 5. Client documents outside content hain, is liye Skill ko unhein parhne ki ijazat hi nahi honi chahiye.","Step 6. Sampling the held files gives them too much weight, so only the delivered files should be checked.":"Step 6. held files ka sample lene se unhein zyada wazan milta hai, is liye sirf delivered files check hone chahiye.","Which is the first step at which Khalid's work departs from the method?":"Pehla woh step kaun sa hai jahan Khalid ka kaam tareeqe se hat jata hai?","Scenario: ChurnGuard, Retention Calls. An AI Skill reads about 5,200 weekly subscriber records, predicts churn and drafts retention offers. Khalid's session can read and write the subscriber drive and send discount offers. The client contract requires any AI use in retention offers to be stated.":"Scenario: ChurnGuard, Retention Calls. Aik AI Skill har hafte taqreeban 5,200 subscriber records parhti hai, churn predict karti hai aur retention offers ka draft banati hai. Khalid ka session subscriber drive parh aur likh sakta hai aur discount offers send kar sakta hai. Client contract kehta hai ke retention offers mein AI ka istemal likha hona chahiye.","Review needed; a retention lead checks each retention offer before it is released":"Review zaroori hai; retention lead har retention offer ko release se pehle check karta hai","Subscriber names and phone numbers masked, no key kept; now Yellow, approved workspace":"Subscriber ke naam aur phone numbers masked hain, koi key nahi rakhi; ab Yellow, approved workspace","Built by the Marketing Data team; owner named, release notes read":"Marketing Data team ne banaya; owner ka naam hai, release notes parhe gaye","Subscriber replies treated as outside content; releasing and approving stay with a person":"Subscriber replies ko outside content samjha gaya; release aur approve karna insaan ke paas rehta hai","Sampled the uncontacted subscribers; retention offers released with no mention of AI though the contract requires it":"uncontacted subscribers ka sample liya; retention offers AI ka zikr kiye bina release hue halan ke contract iska taqaza karta hai","Offer sent to the wrong subscriber; contained, facts recorded, owner told":"Offer sent to the wrong subscriber; roka gaya, haqaiq record kiye, owner ko bataya","Step 5. Subscriber replies are outside content, so the Skill must never be allowed to read them at all.":"Step 5. Subscriber replies outside content hain, is liye Skill ko unhein parhne ki ijazat hi nahi honi chahiye.","Which is the first step at which Lubna's work departs from the method?":"Pehla woh step kaun sa hai jahan Lubna ka kaam tareeqe se hat jata hai?","Scenario: Metro Rail, Incident Reports. An AI Skill reads about 650 weekly incident reports, classifies each report and drafts safety alerts. Lubna's session can read and write the safety drive and publish alerts.":"Scenario: Metro Rail, Incident Reports. Aik AI Skill har hafte taqreeban 650 incident reports parhti hai, har report classify karti hai aur safety alerts ka draft banati hai. Lubna ka session safety drive parh aur likh sakta hai aur alerts publish kar sakta hai.","Review needed; someone will check the safety alerts before they go out":"Review zaroori hai; koi na koi safety alerts bhejne se pehle check kar lega","Staff names and passenger details masked, no key kept; now Yellow, approved workspace":"Staff ke naam aur passenger details masked hain, koi key nahi rakhi; ab Yellow, approved workspace","Built by the Operations team; owner named, release notes read":"Operations team ne banaya; owner ka naam hai, release notes parhe gaye","Session set to read-only and draft-only; releasing stays with a safety officer":"Session sirf read-only aur draft-only par set hai; release safety officer ke paas rehta hai","Passenger reports treated as outside content; releasing and approving stay with a person":"Passenger reports ko outside content samjha gaya; release aur approve karna insaan ke paas rehta hai","Sampled the unescalated reports as well as the escalated reports":"unescalated reports aur escalated reports dono ka sample liya","Alert published for the wrong station; deleted it quietly and carried on, told no one":"Alert published for the wrong station; khamoshi se delete kiya aur kaam jari rakha, kisi ko nahi bataya","Step 8. The alert published for the wrong station was deleted quietly instead of being contained, recorded, and reported to its owner.":"Step 8. alert published for the wrong station ko roke, record kiye aur report kiye bina khamoshi se delete kar diya gaya.","Step 4. Even draft-only access lets AI act on passengers, so all access must be withdrawn entirely.":"Step 4. Draft-only access bhi AI ko passengers par amal karne deta hai, is liye saara access poori tarah wapas lena chahiye.","Step 7. A one-page record cannot cover every safety alert, so each one needs its own record.":"Step 7. Aik page ka record har safety alert ko cover nahi kar sakta, is liye har aik ka alag record chahiye.","Which is the first step at which Moin's work departs from the method?":"Pehla woh step kaun sa hai jahan Moin ka kaam tareeqe se hat jata hai?","Scenario: Prime Travel, Visa Support. An AI Skill reads about 1,300 weekly visa applications, checks documents and drafts support letters. Moin's session can read and write the travel drive and send letters to embassies.":"Scenario: Prime Travel, Visa Support. Aik AI Skill har hafte taqreeban 1,300 visa applications parhti hai, documents check karti hai aur support letters ka draft banati hai. Moin ka session travel drive parh aur likh sakta hai aur letters to embassies send kar sakta hai.","Review needed; a travel desk lead checks each support letter before it is released":"Review zaroori hai; travel desk lead har support letter ko release se pehle check karta hai","Built by the Travel Systems team; owner named, release notes read":"Travel Systems team ne banaya; owner ka naam hai, release notes parhe gaye","Session set to read-only and draft-only; releasing stays with a travel desk lead":"Session sirf read-only aur draft-only par set hai; release travel desk lead ke paas rehta hai","Traveller documents treated as outside content; releasing and approving stay with a person":"Traveller documents ko outside content samjha gaya; release aur approve karna insaan ke paas rehta hai","Sampled the unsupported applicants as well as the supported applicants":"unsupported applicants aur supported applicants dono ka sample liya","Letter sent for the wrong traveller; contained, facts recorded, owner told":"Letter sent for the wrong traveller; roka gaya, haqaiq record kiye, owner ko bataya","Step 1. A wrong support letter cannot be undone, so no AI use is appropriate and the work must stay human-owned.":"Step 1. Ghalat support letter wapas nahi ho sakta, is liye AI ka istemal munasib nahi aur kaam insaan ke paas rehna chahiye.","Step 3. An in-house build still needs outside certification, so the Travel Systems team tool cannot be used yet.":"Step 3. Andaruni banaya hua tool bhi bahari certification chahta hai, is liye Travel Systems team ka tool abhi istemal nahi ho sakta."};
let S=Q,md=0,i=0,A=[],lang=0,left=0,tm,st=0;
const $=s=>document.querySelector(s);
const fmt=s=>Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const tx=o=>lang&&o[1]?o[1]+'<span class="s">'+o[0]+'</span>':o[0];
const L='ABCD';
const rdy=q=>RM[q.q[0]]&&(!q.sc||(RM[q.sc]&&q.tb.every(r=>RM[r[2]])))&&q.o.every(o=>RM[o[0]]);
const rmx=t=>lang&&RM[t]?'<span class="rmt">'+RM[t]+'</span>':'';
function bar(){return '<div class="bar"><span id="tm">'+(st==1?fmt(left):'PCAO-F')+'</span><button class="t" onclick="lg()">'+(lang?'English only':'Roman English ('+Q.filter(rdy).length+'/'+Q.length+')')+'</button><button class="t" onclick="th()">Dark / Light</button></div>'}
function th(){const d=document.documentElement;const dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dk?'light':'dark'}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(){return sh(Q).map(q=>{const p=sh([0,1,2,3]);return {q:q.q,o:p.map(k=>q.o[k]),a:p.indexOf(q.a),x:q.x,t:q.t,L:q.L,R:q.R,sc:q.sc,tb:q.tb}})}
const SY=window.speechSynthesis;let vo=0,vk=0,vt=0;
function vl(m){const b=$('#vb');if(b)b.textContent=m}
function vn(m){const e=$('#vn');if(e)e.textContent=m||''}
function vs(){vo=0;clearInterval(vk);clearTimeout(vt);try{SY&&SY.cancel()}catch(e){}vl('\u{1F50A} Voice');vn('')}
function ch(t){const o=[];(t.match(/[^.!?;:]+[.!?;:]*\s*/g)||[t]).forEach(x=>{x=x.trim();if(!x)return;while(x.length>180){let c=x.lastIndexOf(' ',180);if(c<60)c=180;o.push(x.slice(0,c));x=x.slice(c).trim()}if(x)o.push(x)});return o}
function sp(){if(!SY||typeof SpeechSynthesisUtterance==='undefined'){vn('Is browser/app me voice support nahi hai. Chrome ya Safari me page kholo.');return}
if(vo){vs();return}
const q=S[i],P=[];
if(q.sc)P.push(q.sc);
if(q.tb)q.tb.forEach(r=>P.push('Step '+r[0]+'. '+r[1]+'. '+r[2]));
P.push(q.q[0]);
q.o.forEach((o,k)=>P.push('Option '+L[k]+'. '+o[0]));
const U=[];P.forEach(t=>ch(t).forEach(c=>U.push(c)));
vo=1;vl('\u23F9 Stop');vn('');
try{SY.cancel()}catch(e){}
const vz=SY.getVoices()||[];const v=vz.find(x=>/^en-(US|GB|IN)/i.test(x.lang))||vz.find(x=>/^en/i.test(x.lang));
let started=0;
setTimeout(()=>{if(!vo)return;
U.forEach((t,n)=>{const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'en-US';if(v)u.voice=v;u.rate=.95;
u.onstart=()=>{started=1;vn('')};
u.onerror=e=>{if(e&&(e.error==='canceled'||e.error==='interrupted'))return;vn('Voice error: '+(e&&e.error||'unknown'));vo=0;vl('\u{1F50A} Voice')};
if(n==U.length-1)u.onend=()=>{if(vo){vs()}};
SY.speak(u)});
clearInterval(vk);vk=setInterval(()=>{if(SY.speaking&&!SY.paused){SY.pause();SY.resume()}},10000);
vt=setTimeout(()=>{if(vo&&!started){vn('Awaaz start nahi hui. Phone ki media volume check karo, ya is page ko Chrome/Safari me kholo (Claude app me voice block ho sakti hai).');vo=0;vl('\u{1F50A} Voice')}},3000)},120)}
if(SY){SY.getVoices();SY.onvoiceschanged=()=>{}}
function lg(){vs();lang=1-lang;r()}
function start(){vs();S=mk();i=0;A=[];left=7200;st=1;clearInterval(tm);tm=setInterval(()=>{left--;const e=$('#tm');if(e)e.textContent=fmt(left);if(left<=0)fin()},1000);r()}
function fin(){vs();clearInterval(tm);st=2;r()}
function pick(k){if(A[i]!=null)return;A[i]=k;r()}
function go(d){vs();i+=d;r()}
function r(){
const a=$('#app');
if(st==0){a.innerHTML=bar()+'<h1>PCAO-F mock exam</h1><p>60 long scenario questions in one sitting. Time: 2 hours. Final score is shown on a 300 to 1000 scale with a pass mark of 720, plus a percentage and your score by topic.</p><p>Tap an option to see at once whether it is right or wrong. Questions and options are shuffled on every attempt. In a table scenario, scan the steps from top to bottom and stop at the first wrong one.</p><p class="m">Practice questions built from the course material and an exam study deck, not real exam questions. English only.</p><p><button class="go" onclick="start()">Start exam</button></p>';return}
if(st==1){const q=S[i],d=A[i]!=null;
const fb=d?'<div class="rv"><p class="'+(A[i]===q.a?'ok':'no')+'">'+(A[i]===q.a?'Correct':'Wrong. Correct answer: '+L[q.a])+'</p><p>'+q.x+'</p></div>':'';
a.innerHTML=bar()+'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><p class="m">Question '+(i+1)+' of '+S.length+'</p><button class="t" id="vb" onclick="sp()">'+(vo?'\u23F9 Stop':'\u{1F50A} Voice')+'</button></div><p class=\"m\" id=\"vn\" style=\"color:var(--no)\"></p>'+(lang&&!rdy(q)?'<p class="m">Roman version of this question is not added yet, so it is shown in English.</p>':'')+(q.sc?'<div class="sc"><b>'+q.sc+'</b>'+rmx(q.sc)+'</div><div class="tw"><table>'+q.tb.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+rmx(r[2])+'</td></tr>').join('')+'</table></div>':'')+'<h2>'+tx(q.q)+rmx(q.q[0])+'</h2>'+q.o.map((o,k)=>'<button class="o'+(d?(k===q.a?' good':(k===A[i]?' bad':'')):'')+'" onclick="pick('+k+')"><b>'+L[k]+'.</b> '+tx(o)+rmx(o[0])+(d?'<span class="tg '+(k===q.a?'ok':'no')+'">'+(k===q.a?'Right':'Wrong')+'</span>':'')+'</button>').join('')+fb+'<div class="nav"><button class="t" '+(i?'':'disabled')+' onclick="go(-1)">Previous</button>'+(i<S.length-1?'<button class="go" onclick="go(1)">'+(d?'Next':'Skip')+'</button>':'<button class="go" onclick="fin()">Finish test</button>')+'</div>';return}
let sc=0;const rv=S.map((q,n)=>{const ok=A[n]===q.a;if(ok)sc++;return '<div class="rv"><p class="m">Question '+(n+1)+'</p><p>'+tx(q.q)+'</p><p class="'+(ok?'ok':'no')+'">'+(ok?'Correct':(A[n]==null?'Not answered':'Wrong'))+'</p><p>Your answer: '+(A[n]==null?'none':L[A[n]])+'. Correct answer: <b>'+L[q.a]+'</b>. '+q.x+'</p></div>'}).join('');
const tp={};S.forEach((q,n)=>{const t=tp[q.t]||(tp[q.t]=[0,0]);t[1]++;if(A[n]===q.a)t[0]++});const ks=Object.keys(tp).sort((x,y)=>tp[x][0]/tp[x][1]-tp[y][0]/tp[y][1]);const tb=ks.map((k,j)=>'<div class="rv"><b>'+k+'</b>: '+tp[k][0]+' / '+tp[k][1]+' ('+Math.round(tp[k][0]/tp[k][1]*100)+'%)'+(j==0?' <span class="no">Weakest topic</span>':'')+'</div>').join('');
const N=S.length,pc=Math.round(sc/N*100),ss=300+Math.round(sc/N*700),ps=ss>=720;
a.innerHTML=bar()+'<h1>Your result</h1><div class="big">'+ss+' / 1000</div><p class="'+(ps?'ok':'no')+'">'+(ps?'Pass':'Below the pass mark')+' (pass mark 720)</p><p>'+sc+' of '+N+' correct, '+pc+'%</p><h2>Score by topic</h2>'+tb+rv+'<p><button class="go" onclick="start()">Retake test</button></p>'}
r();
</script></body></html>
